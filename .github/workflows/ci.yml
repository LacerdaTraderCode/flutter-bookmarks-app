name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Toolchain versions
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test with coverage
        run: flutter test --coverage --reporter expanded
      - name: Coverage summary
        run: |
          awk -F: '/^LF:/{lines+=$2} /^LH:/{hit+=$2} END{printf "Line coverage: %.1f%% (%d of %d lines)\n", 100*hit/lines, hit, lines}' coverage/lcov.info

  build-android:
    name: Debug Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate the Android platform folder
        run: flutter create --platforms=android --project-name flutter_bookmarks_app .
      - name: Install dependencies
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
