name: flutter_bookmarks_app
description: Mobile reading list for the Django Ninja bookmarks API.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  flutter_riverpod: ^3.4.1
  flutter_secure_storage: ">=9.2.4 <11.0.0"
  go_router: ">=14.8.1 <18.0.0"
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
